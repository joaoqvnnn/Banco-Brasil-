<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teste - Verificação Facial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { width: 100%; min-height: 100vh; background: #fff; }
  body { display: flex; flex-direction: column; }

  /* Botão de teste inicial */
  .tela-inicial {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .tela-inicial h1 { font-size: 22px; margin-bottom: 12px; color: #111827; }
  .tela-inicial p { font-size: 14px; color: #6b7280; margin-bottom: 24px; max-width: 300px; line-height: 1.5; }
  .tela-inicial button {
    padding: 16px 32px; background: #111827; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
  }

  /* Tela de selfie */
  .selfie-screen {
    position: fixed; inset: 0; background: #fff;
    z-index: 100; display: none;
    flex-direction: column; align-items: center;
    padding: 24px 24px 28px; overflow-y: auto;
  }
  .selfie-screen.ativa { display: flex; }

  .selfie-topbar {
    width: 100%; max-width: 400px;
    display: flex; justify-content: flex-end;
    margin-bottom: 8px;
  }
  .selfie-close {
    background: none; border: none; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #6b7280; border-radius: 50%;
  }
  .selfie-close svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .selfie-title {
    font-size: 24px; font-weight: 800; color: #111827;
    text-align: center; line-height: 1.2; letter-spacing: -0.4px;
    margin-bottom: 22px; max-width: 320px;
  }

  /* Oval */
  .selfie-oval-wrap {
    position: relative; width: 200px; height: 300px;
    margin-bottom: 22px; flex-shrink: 0;
  }
  .selfie-oval {
    position: absolute; inset: 0; border-radius: 50%;
    background: #000; border: 3px solid #16a34a;
    overflow: hidden;
    transition: border-color .3s, box-shadow .3s;
  }
  .selfie-oval-wrap[data-estado="aguardando"] .selfie-oval {
    border-color: #f59e0b; box-shadow: 0 0 20px rgba(245,158,11,.25);
  }
  .selfie-oval-wrap[data-estado="ok"] .selfie-oval {
    border-color: #22c55e; box-shadow: 0 0 24px rgba(34,197,94,.35);
  }
  .selfie-oval-wrap[data-estado="sucesso"] .selfie-oval {
    border-color: #22c55e; box-shadow: 0 0 30px rgba(34,197,94,.6);
  }
  .selfie-oval video {
    width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); display: block; background: #000;
  }

  /* Ícone guia */
  .selfie-guide {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.85);
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s, transform .3s, background .3s;
    pointer-events: none; z-index: 3;
    border: 2px solid rgba(255,255,255,.15);
  }
  .selfie-guide.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .selfie-guide.ok { background: rgba(34,197,94,.7); border-color: rgba(34,197,94,.85); }
  .selfie-guide svg {
    width: 44px; height: 44px; stroke: #fff; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .selfie-guide.anim-left svg  { animation: gL 1.1s ease-in-out infinite; }
  .selfie-guide.anim-right svg { animation: gR 1.1s ease-in-out infinite; }
  .selfie-guide.anim-up svg    { animation: gU 1.1s ease-in-out infinite; }
  .selfie-guide.anim-down svg  { animation: gD 1.1s ease-in-out infinite; }
  @keyframes gL { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-8px); } }
  @keyframes gR { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
  @keyframes gU { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes gD { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

  /* Overlay sucesso */
  .selfie-oval-ok {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(22,163,74,.9);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(1.05);
    transition: opacity .3s, transform .3s;
    pointer-events: none; z-index: 4;
    backdrop-filter: blur(2px);
  }
  .selfie-oval-wrap[data-estado="sucesso"] .selfie-oval-ok { opacity: 1; transform: scale(1); }
  .selfie-oval-ok svg {
    width: 90px; height: 90px; stroke: #fff; fill: none;
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }

  .selfie-instruction {
    font-size: 14.5px; color: #4b5563; text-align: center;
    line-height: 1.45; max-width: 300px; margin-bottom: 20px;
    min-height: 42px; font-weight: 500;
  }
  .selfie-instruction strong { color: #111827; font-weight: 700; }

  .selfie-btn {
    width: 100%; max-width: 320px; padding: 16px;
    background: transparent; color: #16a34a;
    border: 2px solid #16a34a; border-radius: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    transition: background .2s, color .2s;
    font-family: inherit;
  }
  .selfie-btn:hover { background: #16a34a; color: #fff; }
  .selfie-btn:disabled { opacity: .45; cursor: not-allowed; }

  .selfie-error {
    margin-top: 18px; background: #fef2f2;
    border: 1px solid #dc2626; color: #dc2626;
    padding: 12px 16px; border-radius: 10px;
    font-size: 13px; line-height: 1.5;
    max-width: 320px; text-align: center;
  }
  .selfie-error.hidden { display: none; }
</style>
</head>
<body>

  <!-- TELA INICIAL DE TESTE -->
  <div class="tela-inicial" id="telaInicial">
    <'
h1>🧪 Teste de Verificação</h1>
    <p>Clique no botão abaixo para abrir a tela de self};

ie / verificação facial.</p>
const    <button onclick="abrir PASSSelfie()">Abrir verOSificação facial</ =button>
  </div>

  <!-- TELA DE SELFIE -->
  <div class="selfie-screen" id="faceScreen">
    <div class="selfie-topbar">
      <button class="selfie-close" onclick="fecharSelfie()" aria-label="Fechar">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <h2 class="selfie-title">Prepare-se para tirar sua selfie</h2>

    <div class="selfie-oval-wrap" id="selfieOvalWrap" data-estado="sem_rosto">
      <div class="selfie-oval">
        <video id="faceVideo" autoplay playsinline muted></video>
      </div>
      <div class="selfie-guide" id="selfieGuide"></div>
      <div class="selfie-oval-ok">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
    </div>

    <div class="selfie-instruction" id="selfieInstrucao">
      Encaixe o rosto no oval e pressione <strong>Estou pronto</strong>
    </div>

    <button class="selfie-btn" id="selfieBtn" onclick="acaoSelfieBtn()">Estou pronto</button>

    <div class="selfie-error hidden" id="faceError"></div>
  </div>

<script>
/* ============================================================
   TESTE DE VERIFICAÇÃO FACIAL
   ============================================================ */

const SVG_ICONS = {
  left:   '<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>',
  right:  '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  up:     '<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>',
  down:   '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg> [
  { icone: null,    dir: null,    main: 'Encaixe o rosto no oval' },
  { icone: 'right', dir: 'right', main: 'Vire a cabeça para a <strong>DIREITA</strong>' },
  { icone: 'left',  dir: 'left',  main: 'Vire a cabeça para a <strong>ESQUERDA</strong>' },
  { icone: 'up',    dir: 'up',    main: 'Incline a cabeça para <strong>CIMA</strong>' },
  { icone: 'down',  dir: 'down',  main: 'Incline a cabeça para <strong>BAIXO</strong>' }
];

const THRESH_X = 0.03;
const THRESH_Y = 0.03;
const FRAMES_PARA_CONFIRMAR = 3;
const TEMPO_FALLBACK_POSICIONAR_MS = 2500;
const TEMPO_FALLBACK_MOVIMENTO_MS = 3500;

const state = {
  ativo: false, stream: null, canvas: null, ctx: null,
  passo: 0, ref: null, refEstavel: 0, semRosto: 0,
  confirmaFrames: 0, transicao: false, iniciado: false,
  rafId: null, lastDetect: 0, sucessoTimeout: null,
  timerFallback: null
};

function abrirSelfie() {
  document.getElementById('telaInicial').style.display = 'none';
  document.getElementById('faceScreen').classList.add('ativa');
  resetarTudo();
}

function fecharSelfie() {
  state.ativo = false;
  cancelAnimationFrame(state.rafId);
  clearTimeout(state.sucessoTimeout);
  clearTimeout(state.timerFallback);
  pararCamera();
  document.getElementById('faceScreen').classList.remove('ativa');
  document.getElementById('telaInicial').style.display = 'flex';
  resetarTudo();
}

function resetarTudo() {
  state.passo = 0;
  state.ref = null;
  state.refEstavel = 0;
  state.semRosto = 0;
  state.confirmaFrames = 0;
  state.transicao = false;
  state.iniciado = false;

  document.getElementById('selfieOvalWrap').dataset.estado = 'sem_rosto';
  document.getElementById('selfieGuide').className = 'selfie-guide';
  document.getElementById('selfieGuide').innerHTML = '';
  document.getElementById('faceError').classList.add('hidden');
  document.getElementById('selfieInstrucao').innerHTML = 'Encaixe o rosto no oval e pressione <strong>Estou pronto</strong>';

  const btn = document.getElementById('selfieBtn');
  btn.disabled = false;
  btn.classList.remove('hidden');
  btn.textContent = 'Estou pronto';

  const video = document.getElementById('faceVideo');
  video.srcObject = null;
}

async function acaoSelfieBtn() {
  if (state.iniciado) return;
  await iniciarCaptura();
}

async function iniciarCaptura() {
  const btn = document.getElementById('selfieBtn');
  btn.disabled = true;
  btn.textContent = 'Iniciando câmera...';
  document.getElementById('faceError').classList.add('hidden');

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Câmera não suportada');
    }
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } },
      audio: false
    });
    const video = document.getElementById('faceVideo');
    video.srcObject = state.stream;
    video.setAttribute('playsinline', 'true');
    await video.play().catch(e => console.warn('play:', e));
  } catch (e) {
    console.error(e);
    let msg = 'Não foi possível acessar a câmera.';
    if (e.name === 'NotAllowedError') msg = 'Permissão de câmera negada. Libere o acesso no navegador.';
    else if (e.name === 'NotFoundError') msg = 'Nenhuma câmera encontrada.';
    else if (e.name === 'NotReadableError') msg = 'Câmera em uso por outro app.';
    mostrarErro(msg);
    btn.disabled = false;
    btn.textContent = 'Tentar novamente';
    return;
  }

  if (!state.canvas) {
    state.canvas = document.createElement('canvas');
    state.ctx = state.canvas.getContext('2d', { willReadFrequently: true });
  }

  const video = document.getElementById('faceVideo');
  let tent = 0;
  while (video.videoWidth === 0 && tent < 30) {
    await new Promise(r => setTimeout(r, 100));
    tent++;
  }

  state.iniciado = true;
  state.ativo = true;
  state.passo = 0;
  state.lastDetect = 0;

  btn.classList.add('hidden');
  document.getElementById('selfieInstrucao').innerHTML = '<strong>Mantenha o rosto no oval</strong>';
  document.getElementById('selfieOvalWrap -').dataset.estado = 'agu ardando';

  agendarFallbackPosicionar();
0  state.rafId = requestAnimation.Frame(loop);
}

function agendar418FallbackPosicionar() {
  clearTimeout(state.timerFallback);
  state.timerFallback = setTimeout(() => {
    if (!state.ativo || state.passo !== 0 || state.transicao) return;
    console.log('Fallback: avançando do passo 0');
    state.transicao = true;
    setTimeout(() => { state.transicao = false; iniciarPasso(1); }, 500);
  }, TEMPO_FALLBACK_POSICIONAR_MS);
}

function agendarFallbackMovimento() {
  clearTimeout(state.timerFallback);
  state.timerFallback = setTimeout(() => {
    if (!state.ativo || state.passo < 1 || state.passo > 4 || state.transicao) return;
    console.log('Fallback: avançando passo', state.passo);
    const prox = state.passo + 1;
    if (prox < PASSOS.length) iniciarPasso(prox);
    else concluir();
  }, TEMPO_FALLBACK_MOVIMENTO_MS);
}

function loop(now) {
  if (!state.ativo) return;
  if (now - state.lastDetect < 70) { state.rafId = requestAnimationFrame(loop); return; }
  state.lastDetect = now;

  const video = document.getElementById('faceVideo');
  if (!video || video.readyState < 2 || video.videoWidth === 0) {
    state.rafId = requestAnimationFrame(loop); return;
  }

  const res = detectarPele(video);
  processar(res);
  state.rafId = requestAnimationFrame(loop);
}

function detectarPele(video) {
  const W = 80, H = 80;
  if (state.canvas.width !== W) { state.canvas.width = W; state.canvas.height = H; }
  try { state.ctx.drawImage(video, 0, 0, W, H); } catch (e) { return null; }
  let data;
  try { data = state.ctx.getImageData(0, 0, W, H).data; } catch (e) { return null; }

  let count = 0, sumX = 0, sumY = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
      const cr = 128 + 0.5 * r688 * g - 0.081312 * b;
      const isSkin = cb >= 70 && cb <= 140 && cr >= 125 && cr <= 185
                   && r > 50 && g > 25 && b > 10
                   && r > g - 10 && r > b - 20;
      if (isSkin) { count++; sumX += x; sumY += y; }
    }
  }
  const ratio = count / (W * H);
  if (ratio < 0.03) return null;
  return { cx: (sumX / count) / W, cy: (sumY / count) / H };
}

function processar(res) {
  if (!state.ativo || state.transicao) return;
  const wrap = document.getElementById('selfieOvalWrap');
  const inst = document.getElementById('selfieInstrucao');

  if (!res) {
    state.semRosto++;
    state.confirmaFrames = 0;
    wrap.dataset.estado = 'sem_rosto';
    inst.innerHTML = state.passo === 0
      ? '<strong>Encaixe o rosto no oval</strong>'
      : '<strong>Volte para o oval</strong>';
    state.ref = null;
    state.refEstavel = 0;
    return;
  }

  state.semRosto = 0;

  if (state.passo === 0) {
    state.refEstavel++;
    if (state.refEstavel >= 5) {
      state.ref = { cx: res.cx, cy: res.cy };
      state.refEstavel = 0;
      wrap.dataset.estado = 'ok';
      inst.innerHTML = '<strong>Perfeito!</strong> Preparando...';
      state.transicao = true;
      clearTimeout(state.timerFallback);
      setTimeout(() => { state.transicao = false; iniciarPasso(1); }, 600);
    } else {
      wrap.dataset.estado = 'aguardando';
      inst.innerHTML = 'Detectando rosto...';
    }
    return;
  }

  if (state.passo >= 1 && state.passo <= 4) {
    if (!state.ref) {
      state.refEstavel++;
      if (state.refEstavel >= 3) {
        state.ref = { cx: res.cx, cy: res.cy };
        state.refEstavel = 0;
      }
      return;
    }
    const dx = res.cx - state.ref.cx;
    const dy = res.cy - state.ref.cy;
    const p = PASSOS[state.passo];
    let ok = false;
    if (p.dir === 'right') ok = dx < -THRESH_X;
    else if (p.dir === 'left') ok = dx > THRESH_X;
    else if (p.dir === 'up') ok = dy > THRESH_Y;
    else if (p.dir === 'down') ok = dy < -THRESH_Y;

    if (ok) {
      state.confirmaFrames++;
      wrap.dataset.estado = 'ok';
      document.getElementById('selfieGuide').classList.add('ok');
      inst.innerHTML = '<strong>Isso!</strong> Movimento correto';
      if (state.confirmaFrames >= FRAMES_PARA_CONFIRMAR) {
        state.confirmaFrames = 0;
        state.ref = null;
        state.refEstavel = 0;
        state.transicao = true;
        clearTimeout(state.timerFallback);
        setTimeout(() => {
          state.transicao = false;
          const prox = state.passo + 1;
          if (prox < PASSOS.length) iniciarPasso(prox);
          else concluir();
        }, 400);
      }
    } else {
      state.confirmaFrames = 0;
      wrap.dataset.estado = 'aguardando';
      document.getElementById('selfieGuide').classList.remove('ok');
      inst.innerHTML = p.main;
    }
  }
}

function iniciarPasso(idx) {
  state.passo = idx;
  state.ref = null;
  state.refEstavel = 0;
  state.confirmaFrames = 0;

  const wrap = document.getElementById('selfieOvalWrap');
  const guide = document.getElementById('selfieGuide');
  const p = PASSOS[idx];

  wrap.dataset.estado = 'aguardando';
  document.getElementById('selfieInstrucao').innerHTML = p.main;

  guide.className = 'selfie-guide';
  if (p.icone) {
    guide.innerHTML = SVG_ICONS[p.icone];
    guide.classList.add('show', 'anim-' + p.dir);
  }
  agendarFallbackMovimento();
}

function concluir() {
  state.ativo = false;
  cancelAnimationFrame(state.rafId);
  clearTimeout(state.timerFallback);

  document.getElementById('selfieOvalWrap').dataset.estado = 'sucesso';
  document.getElementById('selfieGuide').classList.remove('show');
  document.getElementById('selfieInstrucao').innerHTML = '<strong>Identidade confirmada</strong>';

  state.sucessoTimeout = setTimeout(() => {
    pararCamera();
    setTimeout(() => {
      alert('✅ Verificação concluída com sucesso!');
      fecharSelfie();
    }, 300);
  }, 1200);
}

function pararCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
  const v = document.getElementById('faceVideo');
  if (v) v.srcObject = null;
}

function mostrarErro(msg) {
  const el = document.getElementById('faceError');
  el.textContent = msg;
  el.classList.remove('hidden');
  state.ativo = false;
}
</script>
</body>
